name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build application
        run: >-
          xcodebuild -project Copydalis.xcodeproj
          -scheme Copydalis
          -configuration Debug
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Run core tests
        run: swift test
      - name: Run security baseline checks
        run: ./Scripts/security-check.sh
