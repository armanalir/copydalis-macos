name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build application
        run: >-
          xcodebuild -project Copydalis.xcodeproj
          -scheme Copydalis
          -configuration Debug
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Run core tests
        run: swift test
      - name: Run security baseline checks
        run: ./Scripts/security-check.sh
